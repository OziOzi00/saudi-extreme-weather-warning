[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "saudi-extreme-weather-warning"
version = "0.1.0"
description = "Traceable extreme-weather warning prototype for Saudi Arabia"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "xarray>=2024.1",
  "gcsfs>=2024.6",
  "zarr>=2.18",
  "netCDF4>=1.6",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]
graph = ["neo4j>=5.0"]
analysis = ["matplotlib>=3.8"]
verification = ["matplotlib>=3.8", "Pillow>=10.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
