imerg:
  product: IMERG Final Run V07B
  variables:
    - daily_precip_total
  required_time_window: exact_utc_24_hour
  minimum_coverage_fraction: 0.95
  allowed_aggregations:
    - weighted_mean
    - spatial_p95
    - maximum
  output_qc_status: accepted
  permitted_metrics:
    - mae
    - rmse
    - bias

ghcn_daily:
  variables:
    - tmax_c
    - tmin_c
  rejected_when_q_flag_present: true
  formal_observation_time_required: true
  current_observation_time_status: missing
  diagnostic_minimum_station_count: 1
  formal_minimum_station_count: 2
  allowed_aggregations:
    - station_mean
    - station_max
    - station_min
  output_qc_status: provisional
  permitted_metrics:
    - mae
    - rmse
    - bias
  forbidden_outputs:
    - categorical_skill
    - heatwave_sequence
    - threshold_freeze
    - formal_temperature_claim

ssod_v2:
  product: NOAA Synoptic Summary of the Day v2
  utc_window: 00:00-23:59 UTC
  variables:
    - tmax_c
    - tmin_c
  formal_minimum_station_count: 2
  allowed_aggregations:
    - station_mean
    - station_max
    - station_min
  output_qc_status: accepted
  permitted_metrics:
    - mae
    - rmse
    - bias
    - categorical_skill
    - heatwave_sequence
  limitations:
    - Synoptic reports may not capture the true daily extrema.
    - GHCN-Daily remains a corroborating local-day source, not the UTC pairing source.
