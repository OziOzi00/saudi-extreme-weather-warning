# Shared MAZU-like v1 interface. Member A owns formulas; all changes require A/B/C review.
version: mazu_like_v1
source_model: GraphCast
source_resolution: "0.25 degree"
forecast_leads_hours: [24, 48, 72]
mazu_2025_audit:
  status: temporal_comparability_classes_documented_rule_review_pending
  audited_at: "2026-07-15"
  source_pattern: MAZU指标/indicators/saudi_indicators_YYYYMMDD.nc
  coverage_manifest: manifests/mazu_2025_indicator_coverage.csv
  field_mapping:
    daily_precip_total: daily_precip_total
    t2m_c: t2m_c
    tmax_c: tmax_c
    tmin_c: tmin_c
    wind10_speed: wind10_speed
    pwat: pwat
    ivt: ivt
    wind850_speed: wind850_speed
    wind_shear_850_200: wind_shear_850_200
    omega500: omega500
    geopotential_height500: geopotential_height500
  temporal_semantics_document: docs/指标时间语义与聚合口径.md
  comparability:
    hard_gate:
      - daily_precip_total
    cautious_primary:
      - tmax_c
      - tmin_c
    supporting_only:
      - t2m_c
      - wind10_speed
      - pwat
      - ivt
      - wind850_speed
      - wind_shear_850_200
      - omega500
      - geopotential_height500
indicators:
  daily_precip_total:
    unit: mm
    source: total_precipitation_6hr
    method: sum_four_6h_steps_per_24h_window
  t2m_c:
    unit: degC
    source: 2m_temperature
    method: mean_four_6h_steps_kelvin_to_celsius
  tmax_c:
    unit: degC
    source: 2m_temperature
    method: max_four_6h_steps_kelvin_to_celsius
  tmin_c:
    unit: degC
    source: 2m_temperature
    method: min_four_6h_steps_kelvin_to_celsius
  wind10_speed:
    unit: m s-1
    source: [10m_u_component_of_wind, 10m_v_component_of_wind]
    method: vector_magnitude
  pwat:
    unit: kg m-2
    source: specific_humidity
    method: pressure_integral
  ivt:
    unit: kg m-1 s-1
    source: [specific_humidity, u_component_of_wind, v_component_of_wind]
    method: pressure_integral_of_moisture_flux_magnitude
  wind850_speed:
    unit: m s-1
    source: [u_component_of_wind, v_component_of_wind]
    level_hpa: 850
    method: vector_magnitude
  wind_shear_850_200:
    unit: m s-1
    source: [u_component_of_wind, v_component_of_wind]
    levels_hpa: [850, 200]
    method: vector_difference_magnitude
  omega500:
    unit: Pa s-1
    source: vertical_velocity
    level_hpa: 500
    method: direct
  geopotential_height500:
    unit: gpm
    source: geopotential
    level_hpa: 500
    method: divide_by_standard_gravity
