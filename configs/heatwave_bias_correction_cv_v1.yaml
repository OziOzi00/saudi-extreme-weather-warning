    path: handoff/weather_verification/development_pairs.csv
    sha256: 099a730c6bd294fbb872f6ec075bf69f82a91145f7b77d521399a3705bd66521
  region_summaries:
    path: handoff/region_summaries/mazu_like_adm1_indicator_summaries.csv
    sha256: ec9343d4096a8bb31c7797e78be3dc88020f632694abeea1614d309cedabb56d
  case_catalog:
    path: configs/case_catalog_candidates.csv
    sha256: e9aebdc52d28bba8c7899cb7b19450e7597cfe7f2ca0e5b3172e079b0549379c
  base_heatwave_rule:
    path: configs/heatwave_rules_v2.yaml
    sha256: 810a829a0a2e3afc25a73f52022e5f05468f36e9492bc4d6cef20df9d3ca09c1

approved_heatwave_development_case_ids:
  - "20200619_00"
  - "20200706_00"
  - "20200715_00"
  - "20200806_00"
  - "20200908_00"
  - "20200927_00"

estimator:
  method: leave_one_case_out_additive_median_error
  calibration_variable: tmax_c
  calibration_aggregation: station_max
  calibration_qc_status: accepted
  formula: median_observed_minus_forecast_across_all_training_case_leads
  grouping: pooled_regions_and_leads
  minimum_training_cases: 5
  correction_clip_degc:
    minimum: -4.0
    maximum: 4.0

application:
  corrected_summary_variable: tmax_c
  corrected_summary_fields:
    - weighted_mean
    - spatial_p95
    - maximum
    - minimum
  tmin_c: unchanged
  precipitation_and_dynamics: unchanged
  base_rule_thresholds: unchanged
  evaluation_windows: unchanged_interval_overlap

success_gates:
  minimum_event_cases: 3
  minimum_control_cases: 2
  minimum_target_window_recall: 0.6
  minimum_target_window_specificity: 0.8
  minimum_event_case_detection_fraction: 0.666667
  required_control_case_rejection_fraction: 1.0
  observation_qc_required: accepted
  maximum_absolute_final_correction_degc: 4.0

decision_policy:
  eligible: estimate_one_fixed_final_correction_from_all_development_cases_then_freeze_v3_candidate
  blocked: keep_heatwave_rule_draft_and_independent_heatwave_sealed
  independent_test_may_tune_correction: false

limitations:
  - Cross-validation remains development evidence and is not an independent performance claim.
  - Station-maximum error is used as a proxy correction for regional forecast summaries.
  - The correction method and gates must not change after reading cross-validation results.
